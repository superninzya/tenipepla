<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinematic Photo FX</title>

<style>

html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
}

#ui{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:10;
}

#file{
    font-size:18px;
    color:#fff;
}

#wrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    display:none;
}

#photo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    height:100%;
    width:auto;
    min-width:100%;
    object-fit:cover;
    animation:zoom 18s ease-in-out infinite;
}

@keyframes zoom{
    0%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-50%,-50%) scale(1.04); }
    100%{ transform:translate(-50%,-50%) scale(1); }
}

/* Vignette */
#vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(circle,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.65) 100%);
    pointer-events:none;
}

/* Light leak */
#leak{
    position:absolute;
    width:60%;
    height:120%;
    left:-30%;
    top:-10%;
    background:linear-gradient(120deg,
        rgba(255,120,80,0.0),
        rgba(255,120,80,0.15),
        rgba(255,200,120,0.0));
    filter:blur(40px);
    opacity:0.5;
    animation:leakMove 10s ease-in-out infinite;
    pointer-events:none;
}

@keyframes leakMove{
    0%{ transform:translateX(0); opacity:0.2; }
    50%{ transform:translateX(120%); opacity:0.4; }
    100%{ transform:translateX(0); opacity:0.2; }
}

/* Grain canvas */
#grain{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.12;
}

/* dust particles */
.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    border-radius:50%;
    opacity:0.2;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:0;
    }
    20%{opacity:0.3;}
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

</style>

</head>
<body>

<div id="ui">
    <input id="file" type="file" accept="image/*">
</div>

<div id="wrap">

    <img id="photo">

    <div id="leak"></div>
    <div id="vignette"></div>

    <canvas id="grain"></canvas>

</div>

<script>

const file = document.getElementById("file");
const wrap = document.getElementById("wrap");
const photo = document.getElementById("photo");
const canvas = document.getElementById("grain");
const ctx = canvas.getContext("2d");

file.onchange = (e)=>{

    const f = e.target.files[0];
    const url = URL.createObjectURL(f);

    photo.src = url;

    document.getElementById("ui").style.display="none";
    wrap.style.display="block";

    spawnParticles();
    startGrain();
};

/* -------- Grain -------- */

function startGrain(){

    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener("resize",resize);

    function draw(){

        const w = canvas.width;
        const h = canvas.height;

        const img = ctx.createImageData(w,h);

        for(let i=0;i<img.data.length;i+=4){

            const v = Math.random()*255;

            img.data[i]=v;
            img.data[i+1]=v;
            img.data[i+2]=v;
            img.data[i+3]=18;

        }

        ctx.putImageData(img,0,0);

        requestAnimationFrame(draw);

    }

    draw();
}

/* -------- Particles -------- */

function spawnParticles(){

    for(let i=0;i<25;i++){

        const p = document.createElement("div");
        p.className="particle";

        p.style.left = Math.random()*100 + "vw";
        p.style.top = "100vh";

        const duration = 6 + Math.random()*10;

        p.style.animationDuration = duration + "s";
        p.style.opacity = Math.random()*0.3;

        document.body.appendChild(p);

    }

}

</script>

</body>
</html>    font-size:18px;
}

</style>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

</head>
<body>

<div id="ui">
    <input type="file" id="fileInput" accept="image/*">
</div>

<canvas id="renderCanvas"></canvas>

<script>

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);

let scene;
let camera;
let plane;
let planeMaterial;

let zoom = 1;

function createScene(){

    scene = new BABYLON.Scene(engine);

    camera = new BABYLON.FreeCamera(
        "cam",
        new BABYLON.Vector3(0,0,-3),
        scene
    );

    camera.setTarget(BABYLON.Vector3.Zero());

    plane = BABYLON.MeshBuilder.CreatePlane(
        "photo",
        {
            width:2,
            height:3.555
        },
        scene
    );

    planeMaterial =
        new BABYLON.StandardMaterial(
            "mat",
            scene
        );

    planeMaterial.disableLighting = true;
    planeMaterial.emissiveColor =
        new BABYLON.Color3(1,1,1);

    plane.material = planeMaterial;

    createParticles();
    createLightFlare();
    createVignette();

    return scene;
}

function createParticles(){

    const ps =
        new BABYLON.ParticleSystem(
            "dust",
            300,
            scene
        );

    ps.particleTexture =
        new BABYLON.Texture(
            "https://playground.babylonjs.com/textures/flare.png",
            scene
        );

    ps.emitter =
        new BABYLON.Vector3(0,0,0);

    ps.minEmitBox =
        new BABYLON.Vector3(-2,-4,-1);

    ps.maxEmitBox =
        new BABYLON.Vector3(2,4,1);

    ps.color1 =
        new BABYLON.Color4(1,1,1,0.15);

    ps.color2 =
        new BABYLON.Color4(1,1,1,0.05);

    ps.minSize = 0.05;
    ps.maxSize = 0.15;

    ps.minLifeTime = 8;
    ps.maxLifeTime = 14;

    ps.emitRate = 20;

    ps.direction1 =
        new BABYLON.Vector3(-0.03,0.08,0);

    ps.direction2 =
        new BABYLON.Vector3(0.03,0.12,0);

    ps.blendMode =
        BABYLON.ParticleSystem.BLENDMODE_STANDARD;

    ps.start();
}

function createLightFlare(){

    const flare =
        BABYLON.MeshBuilder.CreatePlane(
            "flare",
            {
                width:1.8,
                height:8
            },
            scene
        );

    flare.position.x = -1.5;
    flare.position.z = -0.2;

    const mat =
        new BABYLON.StandardMaterial(
            "flareMat",
            scene
        );

    mat.disableLighting = true;

    mat.emissiveColor =
        new BABYLON.Color3(
            0.25,
            0.25,
            0.25
        );

    mat.alpha = 0.08;

    flare.material = mat;

    scene.registerBeforeRender(()=>{

        flare.position.x =
            Math.sin(
                performance.now()*0.0002
            )*1.2;

    });

}

function createVignette(){

    const pipeline =
        new BABYLON.DefaultRenderingPipeline(
            "pipe",
            true,
            scene,
            [camera]
        );

    pipeline.imageProcessingEnabled = true;

    pipeline.vignetteEnabled = true;

    pipeline.vignetteWeight = 2.5;

    pipeline.vignetteStretch = 0.4;

}

function loadImage(file){

    const reader =
        new FileReader();

    reader.onload = function(e){

        const img =
            new Image();

        img.onload = function(){

            const aspect =
                img.width /
                img.height;

            plane.scaling.x =
                aspect;

            plane.scaling.y = 1;

            planeMaterial.diffuseTexture =
                new BABYLON.Texture(
                    img.src,
                    scene
                );

        };

        img.src =
            e.target.result;

    };

    reader.readAsDataURL(file);
}

document
.getElementById("fileInput")
.addEventListener(
"change",
(e)=>{

    if(!scene)
        createScene();

    loadImage(
        e.target.files[0]
    );

    document
    .getElementById("ui")
    .style.display =
    "none";

});

engine.runRenderLoop(()=>{

    if(!scene) return;

    zoom += 0.00005;

    plane.scaling.scaleInPlace(
        1.00001
    );

    scene.render();

});

window.addEventListener(
"resize",
()=>engine.resize()
);

</script>

</body>
</html>
