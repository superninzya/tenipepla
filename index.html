<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual FX</title>

<style>
html, body{
    margin:0;
    background:#000;
    overflow:hidden;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

#container{
    position:relative;
}

canvas{
    display:block;
    background:#000;
}

.controls{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    display:flex;
    gap:10px;
}
</style>
</head>
<body>

<div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*">
</div>

<div id="container">
    <canvas id="canvas" width="1080" height="1920"></canvas>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let image = null;

const particles = [];

for(let i=0;i<200;i++){
    particles.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*4+1,
        speed:Math.random()*0.4+0.1,
        alpha:Math.random()
    });
}

let analyser = null;
let freqData = null;

document.getElementById("imageInput").addEventListener("change",(e)=>{

    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){

        image = new Image();

        image.onload = ()=>{
            animate();
        };

        image.src = ev.target.result;
    };

    reader.readAsDataURL(file);
});

document.getElementById("audioInput").addEventListener("change", async (e)=>{

    const file = e.target.files[0];
    if(!file) return;

    const audio = new Audio(URL.createObjectURL(file));

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const source = audioCtx.createMediaElementSource(audio);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    freqData = new Uint8Array(analyser.frequencyBinCount);

    audio.play();
});

function getAudioLevel(){

    if(!analyser) return 0;

    analyser.getByteFrequencyData(freqData);

    let sum=0;

    for(let i=0;i<freqData.length;i++){
        sum += freqData[i];
    }

    return sum/freqData.length/255;
}

function drawImage(){

    if(!image) return;

    ctx.drawImage(
        image,
        0,
        0,
        W,
        H
    );
}

function drawFog(time, audio){

    const fogAlpha = 0.03 + audio*0.08;

    for(let i=0;i<6;i++){

        const x =
            W*0.5 +
            Math.sin(time*0.0002+i)*300;

        const y =
            H*0.5 +
            Math.cos(time*0.00015+i)*600;

        const radius =
            450 +
            Math.sin(time*0.001+i)*150;

        const g = ctx.createRadialGradient(
            x,y,0,
            x,y,radius
        );

        g.addColorStop(0,`rgba(255,255,255,${fogAlpha})`);
        g.addColorStop(1,"rgba(255,255,255,0)");

        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fill();
    }
}

function drawLightBeams(time,audio){

    ctx.save();

    ctx.globalCompositeOperation="screen";

    for(let i=0;i<8;i++){

        const angle =
            time*0.00005 +
            i*0.7;

        const x =
            W/2 +
            Math.sin(angle)*400;

        const beamWidth =
            60 +
            audio*250;

        const grad =
            ctx.createLinearGradient(
                x,0,
                x,H
            );

        grad.addColorStop(
            0,
            `rgba(255,255,255,${0.04+audio*0.12})`
        );

        grad.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle=grad;

        ctx.fillRect(
            x-beamWidth/2,
            0,
            beamWidth,
            H
        );
    }

    ctx.restore();
}

function drawParticles(audio){

    ctx.save();

    ctx.globalCompositeOperation="screen";

    particles.forEach(p=>{

        p.y -= p.speed + audio*3;

        if(p.y < -10){
            p.y = H + 10;
            p.x = Math.random()*W;
        }

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,255,255,${
                p.alpha*(0.3+audio)
            })`;

        ctx.arc(
            p.x,
            p.y,
            p.r + audio*4,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.restore();
}

function drawVisualizer(audio){

    const bars = 64;

    const centerY = H*0.85;

    ctx.save();

    ctx.globalCompositeOperation="screen";

    for(let i=0;i<bars;i++){

        let v = audio;

        if(freqData){
            v = freqData[i]/255;
        }

        const x =
            (i/(bars-1))*W;

        const h =
            30 +
            v*400;

        const grad =
            ctx.createLinearGradient(
                0,
                centerY-h,
                0,
                centerY
            );

        grad.addColorStop(
            0,
            "rgba(255,255,255,0.9)"
        );

        grad.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle=grad;

        ctx.fillRect(
            x-4,
            centerY-h,
            8,
            h
        );
    }

    ctx.restore();
}

function drawGlow(audio){

    const radius =
        300 +
        audio*600;

    const g =
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            radius
        );

    g.addColorStop(
        0,
        `rgba(255,255,255,${0.05+audio*0.2})`
    );

    g.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
}

let started=false;

function animate(time=0){

    if(started===false){
        started=true;
    }

    requestAnimationFrame(animate);

    ctx.clearRect(0,0,W,H);

    const audio = getAudioLevel();

    drawImage();

    drawFog(time,audio);

    drawLightBeams(time,audio);

    drawParticles(audio);

    drawGlow(audio);

    drawVisualizer(audio);
}

</script>

</body>
</html>
